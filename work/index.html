<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="description" content="">
  <title>minamite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Inter:wght@300;400;500&family=Noto+Sans+JP:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="blueprint-bg" aria-hidden="true">
    <svg class="blueprint-svg" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
          <path d="M 60 0 L 0 0 0 60" fill="none" stroke="currentColor" stroke-width="0.5" opacity="0.35"/>
        </pattern>
      </defs>
      <rect width="100%" height="100%" fill="url(#grid)"/>
      <g class="skeleton-lines" fill="none" stroke="currentColor" stroke-width="1">
        <rect x="120" y="80" width="520" height="420" stroke-width="1.5"/>
        <rect x="800" y="120" width="480" height="380" stroke-width="1.5"/>
        <line x1="120" y1="200" x2="640" y2="200"/>
        <line x1="120" y1="320" x2="640" y2="320"/>
        <line x1="120" y1="440" x2="640" y2="440"/>
        <line x1="240" y1="80" x2="240" y2="500"/>
        <line x1="400" y1="80" x2="400" y2="500"/>
        <line x1="560" y1="80" x2="560" y2="500"/>
        <line x1="800" y1="240" x2="1280" y2="240"/>
        <line x1="800" y1="360" x2="1280" y2="360"/>
        <line x1="920" y1="120" x2="920" y2="500"/>
        <line x1="1080" y1="120" x2="1080" y2="500"/>
        <line x1="1240" y1="120" x2="1240" y2="500"/>
        <line x1="120" y1="80" x2="240" y2="200" stroke-dasharray="6 4"/>
        <line x1="640" y1="80" x2="560" y2="200" stroke-dasharray="6 4"/>
        <line x1="800" y1="120" x2="920" y2="240" stroke-dasharray="6 4"/>
        <line x1="1280" y1="120" x2="1160" y2="240" stroke-dasharray="6 4"/>
        <polyline points="80,620 360,620 360,780 720,780 720,620 1000,620 1000,780 1360,780 1360,620" stroke-width="1.2"/>
        <line x1="360" y1="620" x2="360" y2="780"/>
        <line x1="720" y1="620" x2="720" y2="780"/>
        <line x1="1000" y1="620" x2="1000" y2="780"/>
        <line x1="520" y1="620" x2="520" y2="780" stroke-dasharray="4 6"/>
        <line x1="860" y1="620" x2="860" y2="780" stroke-dasharray="4 6"/>
        <line x1="1180" y1="620" x2="1180" y2="780" stroke-dasharray="4 6"/>
        <line x1="120" y1="540" x2="640" y2="540" stroke-width="0.6" opacity="0.6"/>
        <line x1="120" y1="535" x2="120" y2="545"/>
        <line x1="640" y1="535" x2="640" y2="545"/>
      </g>
    </svg>
  </div>

  <div class="page">
    <header class="site-title site-title--compact">
      <h1 class="title-pop" aria-label="minamite">
        <span class="title-letter" style="--i: 0">m</span><!--
        --><span class="title-letter" style="--i: 1">i</span><!--
        --><span class="title-letter" style="--i: 2">n</span><!--
        --><span class="title-letter" style="--i: 3">a</span><!--
        --><span class="title-letter" style="--i: 4">m</span><!--
        --><span class="title-letter" style="--i: 5">i</span><!--
        --><span class="title-letter" style="--i: 6">t</span><!--
        --><span class="title-letter" style="--i: 7">e</span>
      </h1>
    </header>

    <main>
      <section class="try-lead">
        <h2>ファイル受け渡し</h2>
        <p>仕事用です。受け取り後、ファイルは削除します。</p>
      </section>

      <section class="gate-panel" id="gate">
        <p>パスワードを入力してください。</p>
        <form class="gate-form" id="gate-form" autocomplete="off">
          <label class="visually-hidden" for="gate-password">パスワード</label>
          <input class="gate-input" id="gate-password" name="password" type="password" inputmode="numeric" required>
          <button class="product-link gate-submit" type="submit">入る</button>
        </form>
        <p class="gate-error" id="gate-error" hidden>パスワードが違います。</p>
      </section>

      <section class="dl-panel" id="downloads" hidden>
        <p class="file-status" id="file-status">読み込み中…</p>
        <div class="file-list" id="file-list" hidden></div>
      </section>
    </main>

    <footer class="site-footer">
      <p class="brand-note">minamite — Software by ミナミテクノ (MinamiteTekuno)</p>
      <p class="copyright">Copyright © 2026 minamite. All rights reserved.</p>
    </footer>
  </div>

  <script src="box.js"></script>
</body>
</html>
